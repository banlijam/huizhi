server:
  address: 127.0.0.1
  port: ${SERVER_PORT:14329}

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/sandbox
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15432/huizhipay_sandbox}
    username: ${SPRING_DATASOURCE_USERNAME:huizhipay}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  mail:
    # Point these values at a local Mailpit/MailHog instance. No external SMTP
    # server is used by the sandbox defaults.
    host: ${SPRING_MAIL_HOST:127.0.0.1}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:sandbox}
    password: ${SPRING_MAIL_PASSWORD:sandbox}
    properties.mail.smtp:
      auth: ${SPRING_MAIL_AUTH:false}
      ssl.enable: false

jwt:
  secret: ${JWT_SECRET:change_this_sandbox_jwt_secret_before_shared_use_32_chars}
  cookie:
    secure: false

huizhipay:
  dummy:
    checkout-result-enabled: false
  transfi:
    outbound-enabled: false
    checkout:
      base-url: https://checkout-server.transfi.com
      outbound-enabled: ${TRANSFI_CHECKOUT_OUTBOUND_ENABLED:false}
      sandbox-credentials-confirmed: ${TRANSFI_CHECKOUT_SANDBOX_CREDENTIALS_CONFIRMED:false}
      public-key: ${TRANSFI_CHECKOUT_PUBLIC_KEY:}
      secret-key: ${TRANSFI_CHECKOUT_SECRET_KEY:}
      payment-link-id: ${TRANSFI_CHECKOUT_PAYMENT_LINK_ID:}
      webhook-enabled: ${TRANSFI_CHECKOUT_WEBHOOK_ENABLED:false}
      webhook-secret: ${TRANSFI_CHECKOUT_WEBHOOK_SECRET:}
  webhooks:
    master-key: ${HUIZHIPAY_WEBHOOK_MASTER_KEY:}
    allowed-hosts: ${HUIZHIPAY_WEBHOOK_ALLOWED_HOSTS:merchant-sandbox.example.test}
  sandbox:
    merchant-return-origin: ${SANDBOX_MERCHANT_RETURN_ORIGIN:https://merchant-sandbox.example.test}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://127.0.0.1:14328}

client:
  transfi:
    url: https://sandbox-api.transfi.com/v3
    mid: SANDBOX_DISABLED_TASK1
    authorization: ""

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
