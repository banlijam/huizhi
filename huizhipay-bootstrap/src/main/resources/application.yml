# 导入敏感配置文件（包含密码、密钥等）
# 请复制 application-secrets.example.yml 为 application-secrets.yml 并填入实际值
spring:
  config:
    import: optional:classpath:application-secrets.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: org.postgresql.Driver
  application:
    name: huizhipay-service-hub
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: false
    clean-disabled: false
    out-of-order: false
    connect-retries: 3
    create-schemas: true
    baseline-description: "Initial baseline"
  mail:
    host: smtp.qiye.aliyun.com
    port: 465
    properties.mail.smtp:
      auth: true
      ssl.enable: true
  jackson:
    time-zone: UTC  # 所有接口时间以 UTC 序列化输出
    # 注意：Spring Boot 4.0 / tools.jackson 3.x 已移除 SerializationFeature.WRITE_DATES_AS_TIMESTAMPS，
    # 默认即以 ISO-8601 字符串输出日期，无需再配置 write-dates-as-timestamps。

jwt:
  expiration: 86400000
  cookie:
    secure: ${JWT_COOKIE_SECURE:true}
# 自定义风控保理及 Stellar 参数
huizhipay:
  dummy:
    # 仅本地沙箱允许浏览器模拟渠道回调；默认关闭，生产结果必须由受信任的支付渠道产生。
    checkout-result-enabled: ${HUIZHIPAY_DUMMY_CHECKOUT_RESULT_ENABLED:false}
  transfi:
    checkout:
      base-url: https://checkout-server.transfi.com
      outbound-enabled: ${TRANSFI_CHECKOUT_OUTBOUND_ENABLED:false}
      sandbox-credentials-confirmed: ${TRANSFI_CHECKOUT_SANDBOX_CREDENTIALS_CONFIRMED:false}
      public-key: ${TRANSFI_CHECKOUT_PUBLIC_KEY:}
      secret-key: ${TRANSFI_CHECKOUT_SECRET_KEY:}
      payment-link-id: ${TRANSFI_CHECKOUT_PAYMENT_LINK_ID:}
      webhook-enabled: ${TRANSFI_CHECKOUT_WEBHOOK_ENABLED:false}
      webhook-secret: ${TRANSFI_CHECKOUT_WEBHOOK_SECRET:}
  webhooks:
    master-key: ${HUIZHIPAY_WEBHOOK_MASTER_KEY:}
    allowed-hosts: ${HUIZHIPAY_WEBHOOK_ALLOWED_HOSTS:merchant-test.example.test}
  security:
    use-aws-kms: false  # 测试环境关闭硬件密钥签名，走本地
  stellar:
    horizon-endpoint: https://horizon-testnet.stellar.org
  factoring:
    default-discount-rate: 0.008  # 默认保理买断溢价手续费 0.8%

app:
  frontend:
    url: http://127.0.0.1:3000  # 前端域名，邮件中的链接会使用

# TransFi 第三方 API 客户端配置
client:
  transfi:
    url: https://sandbox-api.transfi.com/v3
    mid: HODQSB_NA_NA
    authorization: ${TRANSFI_V3_AUTHORIZATION:}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
