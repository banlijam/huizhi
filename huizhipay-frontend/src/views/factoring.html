<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factoring & Settlement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../styles.css">
  <script src="../i18n/zh.js"></script>
  <script src="../i18n/en.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
</head>
<body class="bg-transparent text-slate-300">
  <div class="flex flex-col gap-6 pb-8">
    <div class="grid grid-cols-3 gap-4" id="factoring-cards"></div>

    <div class="bg-[#111827] border border-slate-800/80 rounded-xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800/80">
        <h2 class="text-base font-semibold text-white" data-i18n="factoring.tableTitle">Upcoming T+1 Settlements</h2>
      </div>
      <table class="w-full text-left">
        <thead>
          <tr class="text-[10px] text-slate-500 uppercase tracking-wider bg-slate-900/50 border-b border-slate-800/80">
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.id">Settlement ID</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.date">Date</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.channel">Channel</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.gross">Gross</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.fees">Fees</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.net">Net</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.status">Status</th>
          </tr>
        </thead>
        <tbody id="settlements-body" class="text-sm divide-y divide-slate-800/60">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentLang = 'zh';
    let factoringStats = null;
    let settlements = [];

    function getLangFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('lang') || 'zh';
    }

    function init() {
      currentLang = getLangFromUrl();
      applyLanguage(currentLang);
      loadFactoringData();
    }

    async function loadFactoringData() {
      factoringStats = await fetchFactoringStats();
      settlements = await fetchSettlements();
      renderCards();
      renderSettlements();
    }

    function renderCards() {
      const container = document.getElementById('factoring-cards');
      if (!container || !factoringStats) return;
      
      const stats = [
        { 
          label: 'factoring.chargebackRate', 
          value: factoringStats.chargebackRate + '%', 
          isNegative: true,
          period: 'factoring.belowThreshold'
        },
        { 
          label: 'factoring.factoringLimit', 
          value: '$' + (factoringStats.factoringLimit / 1000) + 'k', 
          period: 'factoring.used',
          periodValue: '$' + factoringStats.factoringUsed.toLocaleString()
        },
        { 
          label: 'factoring.pendingNet', 
          value: '$' + (factoringStats.pendingNet / 1000).toFixed(1) + 'k', 
          period: 'factoring.next48h',
          periodValue: factoringStats.pendingCount + ' transactions'
        }
      ];
      
      const icons = ['alert-triangle', 'wallet', 'clock'];
      const iconBgs = ['bg-red-500/15', 'bg-indigo-500/15', 'bg-amber-500/15'];
      const iconColors = ['text-red-400', 'text-indigo-400', 'text-amber-400'];
      
      container.innerHTML = stats.map((stat, i) => {
        return `
          <div class="p-5 bg-[#111827] border border-slate-800/80 rounded-xl relative overflow-hidden">
            <div class="absolute top-3 right-3 w-7 h-7 rounded-lg ${iconBgs[i]} flex items-center justify-center">
              <i data-lucide="${icons[i]}" class="w-3.5 h-3.5 ${iconColors[i]}"></i>
            </div>
            <p class="text-xs text-slate-500 font-medium" data-i18n="${stat.label}">${t(stat.label, currentLang)}</p>
            <p class="mt-3 text-2xl font-bold text-white ${stat.isNegative ? 'text-red-400' : ''}">${stat.value}</p>
            ${stat.periodValue ? `<p class="mt-1 text-xs text-slate-500">${stat.periodValue}</p>` : ''}
            <p class="mt-1 text-xs text-slate-500" data-i18n="${stat.period}">${t(stat.period, currentLang)}</p>
          </div>
        `;
      }).join('');
      
      applyLanguage(currentLang);
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderSettlements() {
      const body = document.getElementById('settlements-body');
      if (!body) return;
      body.innerHTML = '';
      
      settlements.forEach(settlement => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/30 text-slate-300 transition-colors';
        
        const channelName = t(`factoring.channels.${settlement.channel}`, currentLang) || settlement.channel;
        const statusText = t(`factoring.status.${settlement.status}`, currentLang) || settlement.status;
        
        let statusClass = '';
        if (settlement.status === 'processing') {
          statusClass = 'px-2 py-1 bg-indigo-500/20 rounded text-xs text-indigo-400';
        } else if (settlement.status === 'locked') {
          statusClass = 'px-2 py-1 bg-slate-700/60 rounded text-xs text-slate-300';
        } else {
          statusClass = 'px-2 py-1 bg-slate-700/60 rounded text-xs text-slate-300';
        }
        
        row.innerHTML = `
          <td class="px-6 py-3.5 font-mono text-sm text-indigo-400">${settlement.id}</td>
          <td class="px-6 py-3.5 font-mono text-sm text-slate-400">${settlement.date}</td>
          <td class="px-6 py-3.5 text-sm">${channelName}</td>
          <td class="px-6 py-3.5 font-mono text-sm">${settlement.gross}</td>
          <td class="px-6 py-3.5 font-mono text-sm text-slate-400">${settlement.fees}</td>
          <td class="px-6 py-3.5 font-mono text-sm font-medium text-white">${settlement.net}</td>
          <td class="px-6 py-3.5"><span class="${statusClass}">${statusText}</span></td>
        `;
        body.appendChild(row);
      });
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'lang-change') {
        currentLang = event.data.lang;
        applyLanguage(currentLang);
        renderSettlements();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      init();
    });
  </script>
</body>
</html>
