<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factoring & Settlement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../styles.css">
  <script src="../i18n/zh.js"></script>
  <script src="../i18n/en.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
</head>
<body class="bg-slate-950 text-slate-300">
  <div class="flex flex-col gap-6">
    <div class="grid grid-cols-3 gap-6" id="factoring-cards">
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800">
        <h2 class="text-lg font-semibold text-white" data-i18n="factoring.tableTitle">Upcoming T+1 Settlements</h2>
      </div>
      <table class="w-full text-left">
        <thead>
          <tr class="bg-slate-950/50 text-slate-400 text-sm border-b border-slate-800">
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.id">Settlement ID</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.date">Date</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.channel">Channel</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.gross">Gross</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.fees">Fees</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.net">Net</th>
            <th class="px-6 py-3 font-medium" data-i18n="factoring.table.status">Status</th>
          </tr>
        </thead>
        <tbody id="settlements-body" class="text-sm divide-y divide-slate-800">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentLang = 'zh';
    let factoringStats = null;
    let settlements = [];

    function getLangFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('lang') || 'zh';
    }

    function init() {
      currentLang = getLangFromUrl();
      applyLanguage(currentLang);
      loadFactoringData();
    }

    async function loadFactoringData() {
      factoringStats = await fetchFactoringStats();
      settlements = await fetchSettlements();
      renderCards();
      renderSettlements();
    }

    function renderCards() {
      const container = document.getElementById('factoring-cards');
      if (!container || !factoringStats) return;
      
      const stats = [
        { 
          label: 'factoring.chargebackRate', 
          value: factoringStats.chargebackRate + '%', 
          isNegative: true,
          period: 'factoring.belowThreshold'
        },
        { 
          label: 'factoring.factoringLimit', 
          value: '$' + (factoringStats.factoringLimit / 1000) + 'k', 
          period: 'factoring.used',
          periodValue: '$' + factoringStats.factoringUsed.toLocaleString()
        },
        { 
          label: 'factoring.pendingNet', 
          value: '$' + (factoringStats.pendingNet / 1000).toFixed(1) + 'k', 
          period: 'factoring.next48h',
          periodValue: factoringStats.pendingCount + ' transactions'
        }
      ];
      
      container.innerHTML = stats.map(stat => {
        return `
          <div class="p-6 bg-slate-900 border border-slate-800 rounded-lg">
            <p class="text-sm font-medium text-slate-400" data-i18n="${stat.label}">${t(stat.label, currentLang)}</p>
            <p class="text-3xl font-bold text-white mt-2 ${stat.isNegative ? 'text-red-400' : ''}">${stat.value}</p>
            ${stat.periodValue ? `<p class="text-xs text-slate-500 mt-2">${stat.periodValue}</p>` : ''}
          </div>
        `;
      }).join('');
      
      applyLanguage(currentLang);
    }

    function renderSettlements() {
      const body = document.getElementById('settlements-body');
      if (!body) return;
      body.innerHTML = '';
      
      settlements.forEach(settlement => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/50 text-slate-300';
        
        const channelName = t(`factoring.channels.${settlement.channel}`, currentLang) || settlement.channel;
        const statusText = t(`factoring.status.${settlement.status}`, currentLang) || settlement.status;
        
        let statusClass = '';
        if (settlement.status === 'processing') {
          statusClass = 'px-2 py-1 bg-blue-500/20 rounded text-xs text-blue-400';
        } else if (settlement.status === 'locked') {
          statusClass = 'px-2 py-1 bg-slate-800 rounded text-xs text-white';
        } else {
          statusClass = 'px-2 py-1 bg-slate-700 rounded text-xs text-slate-300';
        }
        
        row.innerHTML = `
          <td class="px-6 py-4 font-mono">${settlement.id}</td>
          <td class="px-6 py-4 font-mono text-slate-400">${settlement.date}</td>
          <td class="px-6 py-4">${channelName}</td>
          <td class="px-6 py-4 font-mono">${settlement.gross}</td>
          <td class="px-6 py-4 font-mono text-slate-400">${settlement.fees}</td>
          <td class="px-6 py-4 font-mono font-medium text-white">${settlement.net}</td>
          <td class="px-6 py-4"><span class="${statusClass}">${statusText}</span></td>
        `;
        body.appendChild(row);
      });
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'lang-change') {
        currentLang = event.data.lang;
        applyLanguage(currentLang);
        renderSettlements();
      }
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
