<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuizhiPay Merchant Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n/zh.js"></script>
  <script src="i18n/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="bg-[#0a0f1e] text-slate-300 font-sans h-screen flex overflow-hidden">

  <!-- ===== SIDEBAR ===== -->
  <aside class="w-56 bg-[#0d1424] border-r border-slate-800/60 flex flex-col">
    <div class="px-5 py-5 border-b border-slate-800/60">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm">H</div>
        <div>
          <div class="text-sm font-bold text-white tracking-wide">HuizhiPay™</div>
          <div class="text-[9px] text-slate-500 uppercase tracking-wider">Compliant Payment Orchestration</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 py-4 px-3 space-y-1">
      <button onclick="switchView('overview')" class="w-full flex items-center px-3 py-2.5 text-slate-400 hover:bg-slate-800/50 rounded-lg nav-btn active transition-colors" data-view="overview">
        <i data-lucide="layout-dashboard" class="w-4.5 h-4.5 mr-3"></i>
        <span class="text-sm font-medium" data-i18n="sidebar.overview">Overview</span>
      </button>
      <button onclick="switchView('factoring')" class="w-full flex items-center px-3 py-2.5 text-slate-400 hover:bg-slate-800/50 rounded-lg nav-btn transition-colors" data-view="factoring">
        <i data-lucide="book-open" class="w-4.5 h-4.5 mr-3"></i>
        <span class="text-sm font-medium" data-i18n="sidebar.ledgerSplits">Ledger & Splits</span>
      </button>
      <button onclick="switchView('settlements')" class="w-full flex items-center px-3 py-2.5 text-slate-400 hover:bg-slate-800/50 rounded-lg nav-btn transition-colors" data-view="settlements">
        <i data-lucide="landmark" class="w-4.5 h-4.5 mr-3"></i>
        <span class="text-sm font-medium" data-i18n="sidebar.settlements">Settlements</span>
      </button>
      <button onclick="switchView('risk')" class="w-full flex items-center px-3 py-2.5 text-slate-400 hover:bg-slate-800/50 rounded-lg nav-btn transition-colors" data-view="risk">
        <i data-lucide="shield" class="w-4.5 h-4.5 mr-3"></i>
        <span class="text-sm font-medium" data-i18n="sidebar.riskAml">Risk & AML</span>
      </button>
      <button onclick="switchView('integrations')" class="w-full flex items-center px-3 py-2.5 text-slate-400 hover:bg-slate-800/50 rounded-lg nav-btn transition-colors" data-view="integrations">
        <i data-lucide="plug" class="w-4.5 h-4.5 mr-3"></i>
        <span class="text-sm font-medium" data-i18n="sidebar.integrations">Integrations</span>
      </button>
      <button onclick="switchView('settings')" class="w-full flex items-center px-3 py-2.5 text-slate-400 hover:bg-slate-800/50 rounded-lg nav-btn transition-colors" data-view="settings">
        <i data-lucide="settings" class="w-4.5 h-4.5 mr-3"></i>
        <span class="text-sm font-medium" data-i18n="sidebar.settings">Settings</span>
      </button>
    </nav>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Header -->
    <header class="px-8 pt-6 pb-4 flex items-start justify-between">
      <div>
        <h1 class="text-2xl font-bold text-white" data-i18n="pages.merchant.title">Merchant Dashboard</h1>
        <p class="text-sm text-slate-500 mt-1" data-i18n="pages.merchant.subtitle">Settlement transparency across fiat rails and on-chain destinations.</p>
      </div>
      <div class="flex items-center gap-5">
        <!-- Environment Toggle -->
        <div class="flex bg-slate-800/60 rounded-lg p-1">
          <button id="env-live" onclick="switchEnv('live')" class="px-3 py-1.5 text-xs font-medium rounded-md bg-indigo-600 text-white transition-all">Live</button>
          <button id="env-sandbox" onclick="switchEnv('sandbox')" class="px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 transition-all">Sandbox</button>
        </div>
        <!-- Language Switcher -->
        <div class="relative">
          <button onclick="toggleLanguageMenu()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md bg-slate-800/60 text-slate-300 hover:bg-slate-700/60 transition-all">
            <i data-lucide="globe" class="w-3.5 h-3.5"></i>
            <span id="current-lang-label">中文</span>
            <i data-lucide="chevron-down" class="w-3 h-3 opacity-60"></i>
          </button>
          <div id="language-menu" class="absolute right-0 mt-1 w-32 bg-[#111827] border border-slate-700 rounded-lg shadow-xl overflow-hidden hidden z-50">
            <button onclick="selectLanguage('zh')" class="w-full flex items-center gap-2 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800 transition-colors" data-lang-item="zh">
              <span>🇨🇳</span><span>中文</span>
            </button>
            <button onclick="selectLanguage('en')" class="w-full flex items-center gap-2 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800 transition-colors" data-lang-item="en">
              <span>🇺🇸</span><span>English</span>
            </button>
          </div>
        </div>
        <!-- Countdown -->
        <div class="text-right">
          <div class="text-[10px] text-slate-500 uppercase tracking-wider" data-i18n="header.nextSettlement">Next T+1 Settlement in</div>
          <div class="text-xl font-bold text-white font-mono" id="settlement-countdown">00:42:15</div>
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="flex-1 overflow-auto px-8 pb-8 relative">
      <!-- iframe loader -->
      <div id="frame-loader" class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
        <div class="flex items-center gap-2 text-slate-500">
          <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
          <span class="text-sm" data-i18n="loading">Loading...</span>
        </div>
      </div>
      <iframe id="content-frame" src="" class="w-full min-h-[calc(100vh-180px)] border-0" title="Content"></iframe>
    </div>
  </main>

  <!-- Top-up Modal -->
  <div id="topup-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
    <div class="bg-[#0d1424] border border-slate-700 w-[400px] rounded-xl shadow-2xl p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-lg font-semibold text-white" data-i18n="topup.title">Crypto Top Up (TRC20)</h3>
        <button onclick="closeTopUpDialog()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <input type="number" id="topup-amount" value="500" class="w-full bg-slate-950 border border-slate-700 rounded-md px-4 py-3 text-white mb-4">
      <button onclick="generateInvoice()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-md">
        <span data-i18n="topup.generate">Generate USDT Address</span>
      </button>
      <p id="topup-result" class="text-green-400 text-sm mt-4 text-center break-all hidden"></p>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed right-4 top-4 z-50 flex flex-col gap-2"></div>

  <script src="js/app.js"></script>
<script>
  async function checkLoginStatus() {
    const loggedIn = await isLoggedIn();
    if (!loggedIn) {
      window.location.href = 'login.html';
    }
  }

  function switchEnv(env) {
    const live = document.getElementById('env-live');
    const sandbox = document.getElementById('env-sandbox');
    if (env === 'live') {
      live.className = 'px-3 py-1.5 text-xs font-medium rounded-md bg-indigo-600 text-white transition-all';
      sandbox.className = 'px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 transition-all';
    } else {
      sandbox.className = 'px-3 py-1.5 text-xs font-medium rounded-md bg-indigo-600 text-white transition-all';
      live.className = 'px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200 transition-all';
    }
  }

  function startCountdown() {
    // 42 minutes 15 seconds
    let totalSeconds = 42 * 60 + 15;
    const el = document.getElementById('settlement-countdown');
    if (!el) return;
    
    function tick() {
      if (totalSeconds <= 0) totalSeconds = 24 * 3600; // reset to 24h
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      totalSeconds--;
    }
    tick();
    setInterval(tick, 1000);
  }

  checkLoginStatus();
  startCountdown();
</script>
</body>
</html>
