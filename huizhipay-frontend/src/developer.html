<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>HuizhiPay Developer Portal</title>
  <style>
    :root{color-scheme:dark;font-family:"Aptos Display","Segoe UI Variable",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 5%,#152339 0,transparent 34%),#070a0f;color:#f4f7fb}main{width:min(620px,100%);padding:34px;border:1px solid #2d394f;border-radius:24px;background:linear-gradient(145deg,#171e2b,#0e131c);box-shadow:0 35px 100px #0009}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#78a7ff,#c0f96c);color:#071017;font-weight:950}.eyebrow{display:block;margin-top:34px;color:#7e8aa0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:9px 0 12px;font-size:36px;letter-spacing:-.045em}p{margin:0;color:#9aa5b6;line-height:1.65}.note{margin-top:24px;padding:15px;border:1px solid #35425a;border-radius:13px;background:#0c121c;color:#b7c3d4;font-size:13px}.actions{display:flex;gap:10px;margin-top:24px}.actions a{padding:11px 15px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:800}.primary{background:#5a91ff;color:#fff}.secondary{border:1px solid #35425a;color:#a9c8ff}@media(max-width:520px){main{padding:25px}h1{font-size:30px}.actions{flex-direction:column;text-align:center}}
  </style>
</head>
<body><main><div class="brand"><span class="mark">H</span><b>HuizhiPay™</b></div><span class="eyebrow">Public MVP boundary</span><h1>开发者门户本周暂缓</h1><p>当前公开版本只开放 Dummy 订单创建、模拟付款和结果查询。API Key、Webhook 控制台和服务状态尚未作为真实功能上线。</p><div class="note">团队内部可通过 <b>/demo</b> 查看带明确样例标记的界面原型；其中的数据和凭证均不代表真实服务。</div><div class="actions"><a class="primary" href="/merchant">返回商户后台</a><a class="secondary" href="/demo?screen=developer">查看内部原型</a></div></main></body>
</html>
