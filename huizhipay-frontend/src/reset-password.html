<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n/zh.js"></script>
  <script src="i18n/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="bg-[#0a0f1e] text-slate-300 font-sans h-screen flex items-center justify-center">

  <div class="w-full max-w-md px-6">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">Huizhi<span class="text-indigo-500">Pay</span></h1>
      <p class="text-slate-400" data-i18n="login.subtitle">Merchant Console</p>
    </div>

    <div class="bg-[#111827] border border-slate-800/80 rounded-xl shadow-2xl p-8">
      <h2 class="text-xl font-semibold text-white mb-6 text-center" data-i18n="reset.title">Reset Password</h2>

      <form id="reset-form" onsubmit="handleReset(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1.5" data-i18n="reset.password">New Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
            <input type="password" id="new-password" required
              class="w-full bg-slate-950 border border-slate-700 rounded-md pl-10 pr-12 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors"
              placeholder="••••••••">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
              <i data-lucide="eye" id="password-toggle" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1.5" data-i18n="reset.confirm">Confirm Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
            <input type="password" id="confirm-password" required
              class="w-full bg-slate-950 border border-slate-700 rounded-md pl-10 pr-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit" id="reset-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-md transition-colors flex items-center justify-center gap-2">
          <span data-i18n="reset.submit">Reset Password</span>
        </button>
      </form>

      <div class="mt-6 text-center">
        <button onclick="goToLogin()" class="text-sm text-indigo-400 hover:text-indigo-300" data-i18n="reset.login">Back to Login</button>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const password = document.getElementById('new-password');
      const toggle = document.getElementById('password-toggle');
      if (password.type === 'password') {
        password.type = 'text';
        toggle.setAttribute('data-lucide', 'eye-off');
      } else {
        password.type = 'password';
        toggle.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    async function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Resetting...</span>`;
      lucide.createIcons();

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (newPassword !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        btn.disabled = false;
        btn.innerHTML = `<span data-i18n="reset.submit">Reset Password</span>`;
        lucide.createIcons();
        applyI18n();
        return;
      }

      try {
        const response = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept-Language': getLanguageHeader()
          },
          body: JSON.stringify({ token, newPassword }),
          credentials: 'include'
        });
        
        if (response.ok) {
          showToast('Password reset successful', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          const data = await response.json();
          showToast(data.message || 'Reset failed', 'error');
        }
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span data-i18n="reset.submit">Reset Password</span>`;
        lucide.createIcons();
        applyI18n();
      }
    }

    function goToLogin() {
      window.location.href = 'login.html';
    }

    lucide.createIcons();
    applyI18n();
  </script>
</body>
</html>
