<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="powered-by" content="frontend-design, webapp-testing">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>HuizhiPay Dummy Payment</title>
  <style>
    :root{color-scheme:dark;--bg:#070a0f;--panel:#101620;--line:#2d394f;--text:#f4f7fb;--muted:#8d98aa;--blue:#5a91ff;--green:#3bd49b;--red:#ff7278;--sans:"Aptos Display","Segoe UI Variable",sans-serif;--mono:"Cascadia Mono",Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 5%,#152339 0,transparent 34%),radial-gradient(circle at 90% 90%,#14251d 0,transparent 30%),var(--bg);color:var(--text);font-family:var(--sans)}
    main{width:min(520px,100%);border:1px solid var(--line);border-radius:26px;padding:30px;background:linear-gradient(155deg,#171e2b,#0e131c);box-shadow:0 35px 100px #0009}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#78a7ff,#c0f96c);color:#071017;font-weight:950}.brand b{display:block}.brand small{color:#758197;font-size:10px}.badge{display:inline-flex;margin-top:28px;padding:7px 10px;border:1px solid #5e4b21;border-radius:999px;background:#261f11;color:#f4c15d;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{margin:14px 0 7px;font-size:31px;letter-spacing:-.04em}.intro{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.amount{display:flex;align-items:end;justify-content:space-between;margin:24px 0 14px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#121925}.amount span{color:var(--muted);font-size:12px}.amount strong{font-size:30px;letter-spacing:-.04em}dl{display:grid;grid-template-columns:110px 1fr;gap:11px;margin:0;padding:17px;border:1px solid #252f42;border-radius:15px;background:#0c1119;font-size:12px}dt{color:#748095}dd{margin:0;text-align:right;font-family:var(--mono);overflow-wrap:anywhere}.PENDING{color:#f4c15d}.SUCCESS{color:var(--green)}.FAILED{color:var(--red)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}button{min-height:48px;border:0;border-radius:12px;color:#fff;font:800 13px var(--sans);cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.success{background:linear-gradient(120deg,#187c58,#3bd49b);color:#06140e}.fail{border:1px solid #70343b;background:#311a20;color:#ff9ca1}.result{min-height:20px;margin-top:15px;color:var(--muted);font-size:12px;text-align:center}.back{display:block;margin-top:18px;color:#91b7ff;font-size:12px;text-align:center;text-decoration:none}@media(max-width:520px){main{padding:23px}.actions{grid-template-columns:1fr}.amount strong{font-size:25px}}
  </style>
</head>
<body><main>
  <div class="brand"><span class="mark">H</span><span><b>HuizhiPay™</b><small>Dummy checkout</small></span></div>
  <span class="badge">Dummy 演示 · 不会真实扣款</span><h1>确认测试付款</h1><p class="intro">核对订单后，选择一种模拟结果。付款成功后将自动返回商户后台。</p>
  <div class="amount"><span>付款金额</span><strong id="amount">—</strong></div>
  <dl><dt>订单号</dt><dd id="order-no">—</dd><dt>当前状态</dt><dd id="status">—</dd><dt>Dummy 交易号</dt><dd id="transaction">—</dd></dl>
  <div class="actions"><button id="success" class="success">模拟付款成功</button><button id="fail" class="fail">模拟付款失败</button></div>
  <div id="result" class="result" role="status">正在加载订单…</div><a class="back" href="/merchant">返回商户后台</a>
</main><script>
const orderNo=new URLSearchParams(location.search).get('orderNo');
const API=`/api/v1/dummy/orders/${encodeURIComponent(orderNo||'')}`;
const buttons=[document.getElementById('success'),document.getElementById('fail')];
async function request(url,options){const response=await fetch(url,options);const body=await response.json();if(!response.ok||body.code!==200)throw new Error(body.message||'请求失败');return body.data}
function render(order){document.getElementById('amount').textContent=`${order.currency} ${Number(order.amount).toFixed(2)}`;document.getElementById('order-no').textContent=order.orderNo;const status=document.getElementById('status');status.textContent=order.status;status.className=order.status;document.getElementById('transaction').textContent=order.transactionId||'—';const result=document.getElementById('result');result.textContent=order.result||'等待选择 Dummy 付款结果';result.className=`result ${order.status}`;buttons.forEach(button=>button.disabled=order.status!=='PENDING')}
function startMerchantCountdown(){const result=document.getElementById('result');let seconds=10;const update=()=>{result.textContent=`付款成功，${seconds} 秒后自动返回商户后台…`};update();const timer=setInterval(()=>{seconds-=1;if(seconds===0){clearInterval(timer);location.href='/merchant';return}update()},1000)}
async function submit(result){buttons.forEach(button=>button.disabled=true);document.getElementById('result').textContent='正在写入 Dummy 结果…';try{const order=await request(`${API}/result`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({result})});render(order);if(order.status==='SUCCESS')startMerchantCountdown()}catch(error){document.getElementById('result').textContent=error.message;buttons.forEach(button=>button.disabled=false)}}
document.getElementById('success').onclick=()=>submit('SUCCESS');document.getElementById('fail').onclick=()=>submit('FAILED');
if(!orderNo){document.getElementById('result').textContent='缺少 orderNo，无法加载订单';buttons.forEach(button=>button.disabled=true)}else request(API).then(render).catch(error=>{document.getElementById('result').textContent=error.message;buttons.forEach(button=>button.disabled=true)});
</script></body></html>
