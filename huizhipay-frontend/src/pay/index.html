<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="powered-by" content="frontend-design, webapp-testing">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>HuizhiPay Payment</title>
  <style>
    :root{color-scheme:dark;--bg:#070a0f;--panel:#101620;--line:#2d394f;--text:#f4f7fb;--muted:#8d98aa;--blue:#5a91ff;--green:#3bd49b;--red:#ff7278;--sans:"Aptos Display","Segoe UI Variable",sans-serif;--mono:"Cascadia Mono",Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 5%,#152339 0,transparent 34%),radial-gradient(circle at 90% 90%,#14251d 0,transparent 30%),var(--bg);color:var(--text);font-family:var(--sans)}
    main{width:min(520px,100%);border:1px solid var(--line);border-radius:26px;padding:30px;background:linear-gradient(155deg,#171e2b,#0e131c);box-shadow:0 35px 100px #0009}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#78a7ff,#c0f96c);color:#071017;font-weight:950}.brand b{display:block}.brand small{color:#758197;font-size:10px}.badge{display:inline-flex;margin-top:28px;padding:7px 10px;border:1px solid #5e4b21;border-radius:999px;background:#261f11;color:#f4c15d;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{margin:14px 0 7px;font-size:31px;letter-spacing:-.04em}.intro{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.amount{display:flex;align-items:end;justify-content:space-between;margin:24px 0 14px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#121925}.amount span{color:var(--muted);font-size:12px}.amount strong{font-size:30px;letter-spacing:-.04em}dl{display:grid;grid-template-columns:110px 1fr;gap:11px;margin:0;padding:17px;border:1px solid #252f42;border-radius:15px;background:#0c1119;font-size:12px}dt{color:#748095}dd{margin:0;text-align:right;font-family:var(--mono);overflow-wrap:anywhere}.PENDING{color:#f4c15d}.SUCCESS{color:var(--green)}.FAILED{color:var(--red)}.payment-section{margin-top:22px}.payment-section.hidden{display:none}.payment-section h2{margin:0 0 12px;font-size:16px;letter-spacing:-.02em}.payment-methods{display:grid;grid-template-columns:1fr 1fr;gap:11px}button{min-height:48px;border:0;border-radius:12px;color:#fff;font:800 13px var(--sans);cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.method{border:1px solid #35425a;background:#151d2a;color:#e7edf7}.method:hover:not(:disabled){border-color:#5a91ff;background:#19263a}.dummy{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #3b7f67;background:linear-gradient(120deg,#187c58,#3bd49b);color:#06140e}.test-tag{padding:3px 5px;border-radius:5px;background:#071b13;color:#75e9b1;font:800 9px var(--mono);letter-spacing:.06em}.cancel{display:block;min-height:auto;margin:18px auto 0;padding:7px 12px;background:transparent;color:#ff9ca1;font-size:12px}.result{min-height:20px;margin-top:8px;color:var(--muted);font-size:12px;text-align:center}.back{display:block;margin-top:13px;color:#91b7ff;font-size:12px;text-align:center;text-decoration:none}.language-toggle{position:fixed;z-index:30;top:20px;right:20px;min-height:auto;border:1px solid #35425a;border-radius:999px;padding:9px 13px;background:#111925;color:#bec8d7;font-size:12px}.transition-layer{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none}.transition-layer.hidden{display:none}.state-card{width:min(360px,100%);padding:22px;border:1px solid #2b364b;border-radius:18px;background:linear-gradient(145deg,#171e2b,#0d121a);box-shadow:0 28px 90px #0009;text-align:center}.state-card h2{margin:12px 0 7px;font-size:18px}.state-card p{margin:0;color:#8e9aab;font-size:12px;line-height:1.55}.spinner{width:30px;height:30px;margin:auto;border:3px solid #29354a;border-top-color:#76a7ff;border-radius:50%;animation:spin .8s linear infinite}.state-icon{width:42px;height:42px;display:grid;place-items:center;margin:auto;border-radius:13px;background:#153b2c;color:#79efb2;font-size:20px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:520px){main{padding:23px}.payment-methods{gap:9px}.method,.dummy{font-size:12px}.amount strong{font-size:25px}.language-toggle{top:12px;right:12px}.transition-layer{padding:16px}}@media(max-width:360px){main{padding:18px}.dummy{gap:4px;font-size:11px}.test-tag{padding:2px 4px;font-size:8px}}
  </style>
</head>
<body><button id="language-toggle" class="language-toggle" type="button" aria-label="切换为 English">EN</button><main>
  <div class="brand"><span class="mark">H</span><span><b>HuizhiPay™</b><small data-i18n="checkoutPage.secureCheckout">安全 Checkout</small></span></div>
  <span id="environment-badge" class="badge">正在载入环境</span><h1 data-i18n="checkoutPage.title">确认付款</h1><p id="payment-intro" class="intro" data-i18n="checkoutPage.intro">核对订单并完成付款。</p>
  <div class="amount"><span data-i18n="checkoutPage.amount">付款金额</span><strong id="amount">—</strong></div>
  <dl><dt data-i18n="checkoutPage.merchant">商户</dt><dd id="merchant-name">—</dd><dt data-i18n="checkoutPage.status">当前状态</dt><dd id="status">—</dd><dt data-i18n="checkoutPage.transaction">交易号</dt><dd id="transaction">—</dd></dl>
  <section class="payment-section" aria-labelledby="payment-method-title"><h2 id="payment-method-title" data-i18n="checkoutPage.chooseMethod">选择付款方式</h2><div class="payment-methods">
    <button class="method unavailable-method" data-method="WECHAT" data-i18n="checkoutPage.wechatPay">微信支付</button><button class="method unavailable-method" data-method="ALIPAY" data-i18n="checkoutPage.alipay">支付宝</button>
    <button class="method unavailable-method" data-method="CARD" data-i18n="checkoutPage.creditCard">信用卡</button><button class="method unavailable-method" data-method="CRYPTO" data-i18n="checkoutPage.crypto">加密货币</button>
    <button class="method unavailable-method" data-method="BALANCE" data-i18n="checkoutPage.balancePayment">余额支付</button><button id="success" class="dummy"><span data-i18n="checkoutPage.dummyPayment">Dummy Payment</span><span class="test-tag">TEST</span></button>
  </div><button id="fail" class="cancel" data-i18n="checkoutPage.cancel">取消付款</button></section>
  <div id="result" class="result" role="status">正在加载订单…</div><a id="return-link" class="back" href="/merchant" data-i18n="checkoutPage.return">返回商户网站</a>
</main><div id="transition" class="transition-layer" role="status" aria-live="polite"><div class="state-card"><div id="transition-visual" class="spinner"></div><h2 id="transition-title">正在加载订单</h2><p id="transition-copy">正在核对订单金额、币种和当前付款状态。</p></div></div><script src="/i18n/zh.js"></script><script src="/i18n/en.js"></script><script src="/js/i18n.js"></script><script src="/app-config.js"></script><script>
let currentLanguage=localStorage.getItem('huizhipay-lang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');
const checkoutText=(key,values={})=>Object.entries(values).reduce((value,[name,replacement])=>value.replace(`{${name}}`,replacement),t(`checkoutPage.${key}`,currentLanguage));
const languageToggle=document.getElementById('language-toggle');
function renderLanguage(){document.documentElement.lang=currentLanguage==='zh'?'zh-CN':'en';applyLanguage(currentLanguage);languageToggle.textContent=currentLanguage==='zh'?'EN':'中文';languageToggle.setAttribute('aria-label',checkoutText('language'));document.getElementById('environment-badge').textContent=checkoutText('securePayment');if(latestOrder)render(latestOrder);else document.getElementById('result').textContent=checkoutText(checkoutToken?'loading':'missingToken');if(activeTransition)showTransition(activeTransition.type,checkoutText(activeTransition.titleKey),checkoutText(activeTransition.copyKey,activeTransition.values))}
languageToggle.addEventListener('click',()=>{currentLanguage=currentLanguage==='zh'?'en':'zh';localStorage.setItem('huizhipay-lang',currentLanguage);renderLanguage()});
const APP_CONFIG=window.HUIZHIPAY_CONFIG||{},IS_DUMMY=APP_CONFIG.mode!=='production',AUTO_RETURN_SECONDS=Number(APP_CONFIG.autoReturnSeconds||10),STATUS_POLL_MS=Number(APP_CONFIG.statusPollMs||2000);
const checkoutToken=new URLSearchParams(location.search).get('checkoutToken');
const API=`${APP_CONFIG.ordersApi||'/api/v1/orders'}/${encodeURIComponent(checkoutToken||'')}`;
const buttons=[...document.querySelectorAll('.payment-section button')];
document.querySelector('.payment-section').classList.toggle('hidden',!IS_DUMMY);
async function request(url,options){const response=await fetch(url,options),raw=await response.text();let body=null;try{body=raw?JSON.parse(raw):null}catch(error){}if(!response.ok||body?.code!==200)throw new Error(body?.message||`${checkoutText('requestError')} (${response.status})`);return body.data}
function showTransition(type,title,copy){const layer=document.getElementById('transition'),visual=document.getElementById('transition-visual');visual.className=type==='loading'?'spinner':'state-icon';visual.textContent=type==='loading'?'':'✓';document.getElementById('transition-title').textContent=title;document.getElementById('transition-copy').textContent=copy;layer.classList.remove('hidden')}
function showLocalizedTransition(type,titleKey,copyKey,values={}){activeTransition={type,titleKey,copyKey,values};showTransition(type,checkoutText(titleKey),checkoutText(copyKey,values))}
function hideTransition(){activeTransition=null;document.getElementById('transition').classList.add('hidden')}
let redirectStarted=false,statusPoll,latestOrder,activeTransition={type:'loading',titleKey:'loadingTitle',copyKey:'loadingCopy',values:{}};
let returnUrl=APP_CONFIG.defaultReturnUrl||'/merchant';
renderLanguage();
function safeReturnUrl(value){try{const url=new URL(value||'/merchant',location.origin);const loopbackHttp=url.protocol==='http:'&&['localhost','127.0.0.1','::1','[::1]'].includes(url.hostname);if(url.origin===location.origin||url.protocol==='https:'||loopbackHttp)return url.href}catch(error){}return new URL('/merchant',location.origin).href}
function render(order){latestOrder=order;returnUrl=safeReturnUrl(order.returnUrl);document.getElementById('return-link').href=returnUrl;document.getElementById('amount').textContent=`${order.currency} ${Number(order.amount).toFixed(2)}`;document.getElementById('merchant-name').textContent=order.merchantName||APP_CONFIG.merchantName||'Merchant';const status=document.getElementById('status');status.textContent=order.status;status.className=order.status;document.getElementById('transaction').textContent=order.transactionId||'—';const result=document.getElementById('result');result.textContent=order.result||checkoutText('waiting');result.className=`result ${order.status}`;buttons.forEach(button=>button.disabled=order.status!=='PENDING')}
function startMerchantCountdown(){if(redirectStarted)return;redirectStarted=true;clearInterval(statusPoll);let seconds=AUTO_RETURN_SECONDS;const update=()=>showLocalizedTransition('success','success','returnCountdown',{seconds});update();const timer=setInterval(()=>{seconds-=1;if(seconds===0){clearInterval(timer);location.href=returnUrl;return}update()},1000)}
async function refreshProductionStatus(){try{const order=await request(API);render(order);if(order.status==='SUCCESS')startMerchantCountdown();else if(order.status==='FAILED')clearInterval(statusPoll)}catch(error){document.getElementById('result').textContent=error.message}}
async function submit(result){buttons.forEach(button=>button.disabled=true);showLocalizedTransition('loading','submittingTitle','submittingCopy');try{const order=await request(`${API}/result`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({result})});render(order);if(order.status==='SUCCESS')startMerchantCountdown();else hideTransition()}catch(error){hideTransition();document.getElementById('result').textContent=error.message;buttons.forEach(button=>button.disabled=false)}}
async function selectUnavailableMethod(method){buttons.forEach(button=>button.disabled=true);const result=document.getElementById('result'),notIntegrated=checkoutText('notIntegrated')||'未接入';try{const message=await request(`${API}/payment-methods/${encodeURIComponent(method)}`,{method:'POST'});result.textContent=message||notIntegrated}catch(error){result.textContent=notIntegrated}finally{if(latestOrder?.status==='PENDING')buttons.forEach(button=>button.disabled=false)}}
document.querySelectorAll('.unavailable-method').forEach(button=>button.onclick=()=>selectUnavailableMethod(button.dataset.method));document.getElementById('success').onclick=()=>submit('SUCCESS');document.getElementById('fail').onclick=()=>submit('FAILED');
if(!checkoutToken){hideTransition();document.getElementById('result').textContent=checkoutText('missingToken');buttons.forEach(button=>button.disabled=true)}else request(API).then(order=>{render(order);hideTransition();if(!IS_DUMMY){if(order.status==='SUCCESS')startMerchantCountdown();else if(order.status==='PENDING')statusPoll=setInterval(refreshProductionStatus,STATUS_POLL_MS)}}).catch(error=>{hideTransition();document.getElementById('result').textContent=error.message;buttons.forEach(button=>button.disabled=true)});
</script></body></html>
